<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Ошибка подтверждения</title></head>
<body style="background:#0f1115;color:#e6eef6;font-family:Inter, sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
  <div style="padding:24px;background:rgba(255,255,255,0.02);border-radius:10px;">
    <h3>Ссылка недействительна</h3>
    {% if reason == 'expired' %}<p>Ссылка устарела.</p>{% elif reason == 'no_user' %}<p>Пользователь не найден.</p>{% else %}<p>Неверная ссылка.</p>{% endif %}
    <p><a href="{% url 'login:register' %}">Зарегистрироваться</a></p>
  </div>
</body>
</html>
