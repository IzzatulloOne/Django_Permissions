<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Запрос ссылки</title></head>
<body style="background:#0f1115;color:#e6eef6;font-family:Inter, sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
  <div style="width:420px;padding:24px;border-radius:12px;background:rgba(255,255,255,0.02)">
    <h2>Получить ссылку для входа</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div>{{ form.email }}{% for e in form.email.errors %}<div class="error">{{ e }}</div>{% endfor %}</div>
      <button type="submit" style="margin-top:12px;padding:10px;border-radius:8px;border:0;background:linear-gradient(90deg,#6ee7b7,#3b82f6);color:#051019;width:100%">Отправить</button>
    </form>
    <p style="text-align:center;margin-top:10px"><a href="{% url 'login:login_view' %}">Назад</a></p>
  </div>
</body>
</html>
